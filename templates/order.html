<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Place your order | Food Diaries</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    {% include '_navbar.html' %}
    <main>
      <header class="page-heading">
        <span class="eyebrow">One step from delicious</span>
        <h1>Make it yours.</h1>
        <p>{{ food[1] }} <strong>· ₹{{ food[2] }}</strong></p>
      </header>
      <form action="/place_order" method="POST">
        <input type="hidden" name="food_id" value="{{ food[0] }}">
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" name="quantity" min="1" value="1" required>
        <label for="payment-method">Payment method</label>
        <select id="payment-method" name="payment_method">
          <option value="UPI">UPI</option>
          <option value="Cash">Cash on delivery</option>
          <option value="Card">Card</option>
        </select>
        <button type="submit">Place order</button>
      </form>
    </main>
  </body>
</html>
