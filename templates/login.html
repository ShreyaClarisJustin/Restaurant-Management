<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Food Diaries</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    {% include '_navbar.html' %}
    <main class="auth-layout">
      <aside class="auth-aside">
        <span class="eyebrow">Welcome back</span>
        <h2>Your favorites are waiting.</h2>
        <p>Pick up where you left off and enjoy something delicious.</p>
      </aside>
      <section class="auth-content">
        <span class="eyebrow">Good to see you</span>
        <h1>Welcome back</h1>
        <p>Log in to continue to Food Diaries.</p>
        <form action="/login" method="POST">
          <label for="email">Email address</label>
          <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>

          <label for="password">Password</label>
          <input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

          <button type="submit">Log in</button>
          <p>New to Food Diaries? <a href="/register">Create an account</a></p>
        </form>
      </section>
    </main>
  </body>
</html>
