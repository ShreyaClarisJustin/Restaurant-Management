<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Food Diaries</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    {% include '_navbar.html' %}
    <main class="auth-layout">
      <aside class="auth-aside">
        <span class="eyebrow">A seat at our table</span>
        <h2>Make every meal memorable.</h2>
        <p>Freshly made favorites, delivered with a little extra love.</p>
      </aside>
      <section class="auth-content">
        <span class="eyebrow">Join the table</span>
        <h1>Create account</h1>
        <p>Sign up for delicious food and easy ordering.</p>
        <form action="/register" method="POST">
          <label for="name">Full name</label>
          <input id="name" type="text" name="name" placeholder="Your name" autocomplete="name" required>

          <label for="email">Email address</label>
          <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>

          <label for="phone">Phone number</label>
          <input id="phone" type="tel" name="phone" placeholder="Your phone number" autocomplete="tel" required>

          <label for="password">Password</label>
          <input id="password" type="password" name="password" placeholder="Create a password" autocomplete="new-password" required>

          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" type="password" name="confirm_password" placeholder="Enter your password again" autocomplete="new-password" required>

          <button type="submit">Create my account</button>
          <p>Already have an account? <a href="/login">Log in</a></p>
        </form>
      </section>
    </main>
  </body>
</html>
